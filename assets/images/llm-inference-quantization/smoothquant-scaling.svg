<svg xmlns="http://www.w3.org/2000/svg" width="400" height="520" viewBox="0 0 400 520" role="img" aria-labelledby="title desc"><title id="title">SmoothQuant 通道配对缩放</title><desc id="desc">激活与对应权重列反向缩放，图形大小不代表幅值。</desc><rect width="400" height="520" rx="12" fill="#f5f8fb"/><g font-family="system-ui,sans-serif" fill="#172d43"><text x="18" y="30" font-size="19">SmoothQuant：成对缩放输入通道</text><text x="18" y="55" font-size="15">教学算例：α=0.5，峰值用数字表示</text><text x="18" y="90" font-size="18">缩放前</text><text x="32" y="119" font-size="15">激活通道峰值</text><text x="215" y="119" font-size="15">对应权重列峰值</text><rect x="32" y="133" width="150" height="35" rx="6" fill="#c5e7df"/><text x="42" y="156" font-size="16">通道 1：100</text><rect x="215" y="133" width="150" height="35" rx="6" fill="#c5e7df"/><text x="225" y="156" font-size="16">通道 1：1</text><rect x="32" y="178" width="150" height="35" rx="6" fill="#d7dff7"/><text x="42" y="201" font-size="16">通道 2：1</text><rect x="215" y="178" width="150" height="35" rx="6" fill="#d7dff7"/><text x="225" y="201" font-size="16">通道 2：1</text><text x="18" y="270" font-size="18">缩放后</text><text x="32" y="299" font-size="15">激活通道峰值</text><text x="215" y="299" font-size="15">对应权重列峰值</text><rect x="32" y="313" width="150" height="35" rx="6" fill="#c5e7df"/><text x="42" y="336" font-size="16">通道 1：10</text><rect x="215" y="313" width="150" height="35" rx="6" fill="#c5e7df"/><text x="225" y="336" font-size="16">通道 1：10</text><rect x="32" y="358" width="150" height="35" rx="6" fill="#d7dff7"/><text x="42" y="381" font-size="16">通道 2：1</text><rect x="215" y="358" width="150" height="35" rx="6" fill="#d7dff7"/><text x="225" y="381" font-size="16">通道 2：1</text><text x="18" y="246" font-size="16">通道 1：激活 ÷10，权重 ×10</text><text x="18" y="428" font-size="16">通道 2：两侧均保持原值</text><text x="18" y="464" font-size="18">X′ = XD⁻¹，W′ = WD</text><text x="18" y="493" font-size="14">量化前点积保持相同，再分别量化两端。</text></g></svg>