<svg xmlns="http://www.w3.org/2000/svg" width="480" height="366" viewBox="0 0 480 366" role="img" aria-labelledby="title desc">
<title id="title">不同 token 的激活幅值</title>
<desc id="desc">教学示意，非模型实测。四个 token、六个特征通道，各格数字为激活绝对值。第 3 和第 6 通道持续偏大，具体幅值随 token 改变。</desc>
