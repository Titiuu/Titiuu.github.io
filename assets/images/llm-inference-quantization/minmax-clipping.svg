<svg xmlns="http://www.w3.org/2000/svg" width="400" height="535" viewBox="0 0 400 535" role="img" aria-labelledby="title desc"><title id="title">Min-Max 与截断的数值映射</title><desc id="desc">两条数轴采用相同线性比例，展示原值与恢复值。</desc><rect width="400" height="535" rx="12" fill="#f5f8fb"/><g font-family="system-ui,sans-serif" fill="#172d43"><text x="18" y="30" font-size="20">范围缩小，格点变密</text><text x="18" y="54" font-size="15">对称 INT4：码值 −7 到 7</text><text x="18" y="90" font-size="18">Min-Max：scale=1</text><path d="M30 115H370" stroke="#50687b"/><path d="M39 110v10" stroke="#50687b"/><path d="M62 110v10" stroke="#50687b"/><path d="M85 110v10" stroke="#50687b"/><path d="M108 110v10" stroke="#50687b"/><path d="M131 110v10" stroke="#50687b"/><path d="M154 110v10" stroke="#50687b"/><path d="M177 110v10" stroke="#50687b"/><path d="M200 110v10" stroke="#50687b"/><path d="M223 110v10" stroke="#50687b"/><path d="M246 110v10" stroke="#50687b"/><path d="M269 110v10" stroke="#50687b"/><path d="M292 110v10" stroke="#50687b"/><path d="M315 110v10" stroke="#50687b"/><path d="M338 110v10" stroke="#50687b"/><path d="M361 110v10" stroke="#50687b"/><text x="33" y="139" font-size="12">-7</text><text x="194" y="139" font-size="12">0</text><text x="355" y="139" font-size="12">7</text><text x="18" y="170" font-size="14">原值 → 恢复值（误差用箭头表示）</text><text x="30" y="194" font-size="14">-1 → -1</text><circle cx="177" cy="190" r="3" fill="#a24535"/><path d="M177 190H177" stroke="#a24535" stroke-width="2"/><rect x="174" y="187" width="6" height="6" fill="#287565"/><text x="30" y="214" font-size="14">-0.4 → 0</text><circle cx="190.8" cy="210" r="3" fill="#a24535"/><path d="M190.8 210H200" stroke="#a24535" stroke-width="2"/><rect x="197" y="207" width="6" height="6" fill="#287565"/><text x="30" y="234" font-size="14">0.6 → 1</text><circle cx="213.8" cy="230" r="3" fill="#a24535"/><path d="M213.8 230H223" stroke="#a24535" stroke-width="2"/><rect x="220" y="227" width="6" height="6" fill="#287565"/><text x="30" y="254" font-size="14">7 → 7</text><circle cx="361" cy="250" r="3" fill="#a24535"/><path d="M361 250H361" stroke="#a24535" stroke-width="2"/><rect x="358" y="247" width="6" height="6" fill="#287565"/><text x="18" y="295" font-size="18">Clipping：scale=0.5</text><path d="M30 320H370" stroke="#50687b"/><path d="M119.5 315v10" stroke="#50687b"/><path d="M131.0 315v10" stroke="#50687b"/><path d="M142.5 315v10" stroke="#50687b"/><path d="M154.0 315v10" stroke="#50687b"/><path d="M165.5 315v10" stroke="#50687b"/><path d="M177.0 315v10" stroke="#50687b"/><path d="M188.5 315v10" stroke="#50687b"/><path d="M200.0 315v10" stroke="#50687b"/><path d="M211.5 315v10" stroke="#50687b"/><path d="M223.0 315v10" stroke="#50687b"/><path d="M234.5 315v10" stroke="#50687b"/><path d="M246.0 315v10" stroke="#50687b"/><path d="M257.5 315v10" stroke="#50687b"/><path d="M269.0 315v10" stroke="#50687b"/><path d="M280.5 315v10" stroke="#50687b"/><text x="33" y="344" font-size="12">-7</text><text x="194" y="344" font-size="12">0</text><text x="355" y="344" font-size="12">7</text><text x="18" y="375" font-size="14">原值 → 恢复值（误差用箭头表示）</text><text x="30" y="399" font-size="14">-1 → -1</text><circle cx="177" cy="395" r="3" fill="#a24535"/><path d="M177 395H177" stroke="#a24535" stroke-width="2"/><rect x="174" y="392" width="6" height="6" fill="#287565"/><text x="30" y="419" font-size="14">-0.4 → -0.5</text><circle cx="190.8" cy="415" r="3" fill="#a24535"/><path d="M190.8 415H188.5" stroke="#a24535" stroke-width="2"/><rect x="185.5" y="412" width="6" height="6" fill="#287565"/><text x="30" y="439" font-size="14">0.6 → 0.5</text><circle cx="213.8" cy="435" r="3" fill="#a24535"/><path d="M213.8 435H211.5" stroke="#a24535" stroke-width="2"/><rect x="208.5" y="432" width="6" height="6" fill="#287565"/><text x="30" y="459" font-size="14">7 → 3.5</text><circle cx="361" cy="455" r="3" fill="#a24535"/><path d="M361 455H280.5" stroke="#a24535" stroke-width="2"/><rect x="277.5" y="452" width="6" height="6" fill="#287565"/><text x="18" y="512" font-size="14">红点：原值；绿方块：恢复值</text></g></svg>