<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 835" role="img" aria-labelledby="title desc">
<title id="title">三种 Prefill 与 Decode 执行方式对照</title>
<desc id="desc">A、B 已在 Decode，C 需要处理 4096 个输入 tokens。完整输入分阶段执行会暂停 A、B 一轮；分块交替在四个输入块之间推进 Decode；混合执行每轮同时推进 A、B 和 C。各组轮次独立编号，列宽不表示耗时。</desc>
<rect width="760" height="835" rx="12" fill="#f7f4ec"/>
<g font-family="sans-serif" fill="#1c2621">
<text x="24" y="34" font-size="21" font-weight="bold">同一组请求，三种执行方式</text>
<text x="24" y="61" font-size="14">同列属于同一 Batch；各组独立编号，列宽不表示耗时</text>
<text x="24" y="92" font-size="18" font-weight="bold">完整 Prefill · 分阶段执行</text>
<text x="198.66666666666669" y="119" font-size="14" text-anchor="middle">1</text>
<path d="M 92.0 126 V 260" stroke="#d8d0c0" stroke-dasharray="4 4"/>
