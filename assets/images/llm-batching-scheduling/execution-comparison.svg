<text x="198.66666666666669" y="198" fill="#fff" font-size="14" text-anchor="middle">D</text>
<rect x="522.6666666666667" y="176" width="205.33333333333334" height="33" rx="5" fill="#244d3f"/>
<text x="625.3333333333334" y="198" fill="#fff" font-size="14" text-anchor="middle">D</text>
<text x="24" y="241" font-size="15">请求 C</text>
<rect x="309.33333333333337" y="219" width="205.33333333333334" height="33" rx="5" fill="#a94a34"/>
<text x="412.00000000000006" y="241" fill="#fff" font-size="14" text-anchor="middle">4096</text>
<rect x="522.6666666666667" y="219" width="205.33333333333334" height="33" rx="5" fill="#244d3f"/>
<text x="625.3333333333334" y="241" fill="#fff" font-size="14" text-anchor="middle">D</text>
<text x="24" y="285" font-size="14">A、B 在第 2 轮暂停；C 完成全部 Prefill 后进入 Decode。</text>
<text x="24" y="324" font-size="18" font-weight="bold">分块 Prefill · 阶段交替</text>
