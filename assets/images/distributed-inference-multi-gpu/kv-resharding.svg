<svg xmlns="http://www.w3.org/2000/svg" width="480" height="419" viewBox="0 0 480 419" role="img" aria-labelledby="title desc"><title id="title">KV 重新分片：P TP=4 → D TP=2</title><desc id="desc">按逻辑 head 和 token 区间映射，非复制块编号。教学示意，布局不按实际耗时或数据大小比例。</desc><rect width="480" height="419" rx="12" fill="#f5f8fb"/><g font-family="system-ui,sans-serif" fill="#172d43">
<text x="18" y="30" font-size="19">KV 重新分片：P TP=4 → D TP=2</text><text x="18" y="54" font-size="14">教学示意 · 非实测 · 色块大小不表示工作量</text>
<text x="18" y="90" font-size="15">P0：heads 0–1 ─┐</text>
<rect x="18.0" y="99" width="438.0" height="34" rx="5" fill="#d7e8fa"/><text x="237.0" y="121" text-anchor="middle" font-size="14">汇入 D0：heads 0–3</text>
<text x="18" y="166" font-size="15">P1：heads 2–3 ─┘</text>
<rect x="18.0" y="175" width="438.0" height="34" rx="5" fill="#d7e8fa"/><text x="237.0" y="197" text-anchor="middle" font-size="14">D0 使用自己的目标物理块</text>
<text x="18" y="242" font-size="15">P2：heads 4–5 ─┐</text>
<rect x="18.0" y="251" width="438.0" height="34" rx="5" fill="#d7e8fa"/><text x="237.0" y="273" text-anchor="middle" font-size="14">汇入 D1：heads 4–7</text>
<text x="18" y="318" font-size="15">P3：heads 6–7 ─┘</text>
<rect x="18.0" y="327" width="438.0" height="34" rx="5" fill="#d7e8fa"/><text x="237.0" y="349" text-anchor="middle" font-size="14">D1 使用自己的目标物理块</text>
<text x="18" y="403" font-size="14">按逻辑 head 和 token 区间映射，非复制块编号</text></g></svg>