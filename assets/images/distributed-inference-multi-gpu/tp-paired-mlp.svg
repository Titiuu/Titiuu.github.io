<svg xmlns="http://www.w3.org/2000/svg" width="480" height="419" viewBox="0 0 480 419" role="img" aria-labelledby="title desc"><title id="title">TP：两层 MLP 配对切分</title><desc id="desc">中间分片直接接入第二层，避免中途收集。教学示意，布局不按实际耗时或数据大小比例。</desc><rect width="480" height="419" rx="12" fill="#f5f8fb"/><g font-family="system-ui,sans-serif" fill="#172d43">
<text x="18" y="30" font-size="19">TP：两层 MLP 配对切分</text><text x="18" y="54" font-size="14">教学示意 · 非实测 · 色块大小不表示工作量</text>
<text x="18" y="90" font-size="15">共同输入 X：两卡复制</text>
<rect x="18.0" y="99" width="216.0" height="34" rx="5" fill="#d7e8fa"/><text x="126.0" y="121" text-anchor="middle" font-size="14">GPU 0</text>
<rect x="240.0" y="99" width="216.0" height="34" rx="5" fill="#c9e8df"/><text x="348.0" y="121" text-anchor="middle" font-size="14">GPU 1</text>
<text x="18" y="166" font-size="15">第一层：按 intermediate 输出维切</text>
<rect x="18.0" y="175" width="216.0" height="34" rx="5" fill="#d7e8fa"/><text x="126.0" y="197" text-anchor="middle" font-size="14">H₀ = X W₀ᵀ</text>
<rect x="240.0" y="175" width="216.0" height="34" rx="5" fill="#c9e8df"/><text x="348.0" y="197" text-anchor="middle" font-size="14">H₁ = X W₁ᵀ</text>
<text x="18" y="242" font-size="15">本地激活 → 第二层按输入维切</text>
<rect x="18.0" y="251" width="216.0" height="34" rx="5" fill="#d7e8fa"/><text x="126.0" y="273" text-anchor="middle" font-size="14">P₀ = f(H₀) V₀ᵀ</text>
<rect x="240.0" y="251" width="216.0" height="34" rx="5" fill="#c9e8df"/><text x="348.0" y="273" text-anchor="middle" font-size="14">P₁ = f(H₁) V₁ᵀ</text>
<text x="18" y="318" font-size="15">All-Reduce：相加后两卡获得 Y</text>
<rect x="18.0" y="327" width="216.0" height="34" rx="5" fill="#d7e8fa"/><text x="126.0" y="349" text-anchor="middle" font-size="14">Y = P₀ + P₁</text>
<rect x="240.0" y="327" width="216.0" height="34" rx="5" fill="#c9e8df"/><text x="348.0" y="349" text-anchor="middle" font-size="14">Y = P₀ + P₁</text>
<text x="18" y="403" font-size="14">中间分片直接接入第二层，避免中途收集</text></g></svg>