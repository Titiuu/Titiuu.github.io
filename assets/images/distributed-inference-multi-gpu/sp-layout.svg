<rect x="18.0" y="327" width="438.0" height="34" rx="5" fill="#d7e8fa"/><text x="237.0" y="349" text-anchor="middle" font-size="14">Reduce-Scatter → 本地分片</text>
<text x="18" y="403" font-size="14">逐 token 算子独立；跨位置 Attention 另需 CP</text></g></svg>