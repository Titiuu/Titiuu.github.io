<rect x="240.0" y="99" width="216.0" height="34" rx="5" fill="#c9e8df"/><text x="348.0" y="121" text-anchor="middle" font-size="14">GPU 1：4096–8191</text>
<text x="18" y="166" font-size="15">各卡本地 LayerNorm</text>
<rect x="18.0" y="175" width="216.0" height="34" rx="5" fill="#d7e8fa"/><text x="126.0" y="197" text-anchor="middle" font-size="14">4096 × hidden</text>
<rect x="240.0" y="175" width="216.0" height="34" rx="5" fill="#c9e8df"/><text x="348.0" y="197" text-anchor="middle" font-size="14">4096 × hidden</text>
<text x="18" y="242" font-size="15">进入需要完整 token 布局的 TP 算子</text>
<rect x="18.0" y="251" width="438.0" height="34" rx="5" fill="#d7e8fa"/><text x="237.0" y="273" text-anchor="middle" font-size="14">All-Gather → TP 计算</text>
