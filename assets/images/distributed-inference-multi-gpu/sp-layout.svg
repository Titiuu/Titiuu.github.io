<svg xmlns="http://www.w3.org/2000/svg" width="480" height="419" viewBox="0 0 480 419" role="img" aria-labelledby="title desc"><title id="title">SP：逐 token 算子分片</title><desc id="desc">逐 token 算子独立；跨位置 Attention 另需 CP。教学示意，布局不按实际耗时或数据大小比例。</desc><rect width="480" height="419" rx="12" fill="#f5f8fb"/><g font-family="system-ui,sans-serif" fill="#172d43">
<text x="18" y="30" font-size="19">SP：逐 token 算子分片</text><text x="18" y="54" font-size="14">教学示意 · 非实测 · 色块大小不表示工作量</text>
<text x="18" y="90" font-size="15">token 维：8192 个位置</text>
