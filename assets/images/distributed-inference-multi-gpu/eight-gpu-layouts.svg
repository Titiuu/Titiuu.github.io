<svg xmlns="http://www.w3.org/2000/svg" width="480" height="495" viewBox="0 0 480 495" role="img" aria-labelledby="title desc"><title id="title">八张 GPU：实例边界决定协作范围</title><desc id="desc">各方案都需单独验证模型与 KV 容量。教学示意，布局不按实际耗时或数据大小比例。</desc><rect width="480" height="495" rx="12" fill="#f5f8fb"/><g font-family="system-ui,sans-serif" fill="#172d43">
<text x="18" y="30" font-size="19">八张 GPU：实例边界决定协作范围</text><text x="18" y="54" font-size="14">教学示意 · 非实测 · 色块大小不表示工作量</text>
