<text x="18" y="242" font-size="15">DP=2 × TP=4：两个四卡实例</text>
<rect x="18.0" y="251" width="216.0" height="34" rx="5" fill="#d7e8fa"/><text x="126.0" y="273" text-anchor="middle" font-size="14">0,1,2,3</text>
<rect x="240.0" y="251" width="216.0" height="34" rx="5" fill="#c9e8df"/><text x="348.0" y="273" text-anchor="middle" font-size="14">4,5,6,7</text>
<text x="18" y="318" font-size="15">TP=8：一个八卡实例</text>
<rect x="18.0" y="327" width="438.0" height="34" rx="5" fill="#d7e8fa"/><text x="237.0" y="349" text-anchor="middle" font-size="14">0,1,2,3,4,5,6,7</text>
<text x="18" y="394" font-size="15">PD：两个资源池，内部布局另定</text>
<rect x="18.0" y="403" width="216.0" height="34" rx="5" fill="#d7e8fa"/><text x="126.0" y="425" text-anchor="middle" font-size="14">P：0,1</text>
<rect x="240.0" y="403" width="216.0" height="34" rx="5" fill="#c9e8df"/><text x="348.0" y="425" text-anchor="middle" font-size="14">D：2,3,4,5,6,7</text>
<text x="18" y="479" font-size="14">各方案都需单独验证模型与 KV 容量</text></g></svg>