<text x="18" y="166" font-size="15">DP=4 × TP=2：四个双卡实例</text>
<rect x="18.0" y="175" width="105.0" height="34" rx="5" fill="#d7e8fa"/><text x="70.5" y="197" text-anchor="middle" font-size="14">0,1</text>
<rect x="129.0" y="175" width="105.0" height="34" rx="5" fill="#c9e8df"/><text x="181.5" y="197" text-anchor="middle" font-size="14">2,3</text>
<rect x="240.0" y="175" width="105.0" height="34" rx="5" fill="#f7dfb7"/><text x="292.5" y="197" text-anchor="middle" font-size="14">4,5</text>
