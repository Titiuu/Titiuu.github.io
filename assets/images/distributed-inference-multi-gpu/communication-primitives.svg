<svg xmlns="http://www.w3.org/2000/svg" width="480" height="495" viewBox="0 0 480 495" role="img" aria-labelledby="title desc"><title id="title">通信原语：输入 → 每卡结果</title><desc id="desc">竖线区分两卡；归约示例采用求和。教学示意，布局不按实际耗时或数据大小比例。</desc><rect width="480" height="495" rx="12" fill="#f5f8fb"/><g font-family="system-ui,sans-serif" fill="#172d43">
<text x="18" y="30" font-size="19">通信原语：输入 → 每卡结果</text><text x="18" y="54" font-size="14">教学示意 · 非实测 · 色块大小不表示工作量</text>
<text x="18" y="90" font-size="15">All-Reduce：元素相加</text>
<rect x="18.0" y="99" width="438.0" height="34" rx="5" fill="#d7e8fa"/><text x="237.0" y="121" text-anchor="middle" font-size="14">a | b → a+b | a+b</text>
<text x="18" y="166" font-size="15">All-Gather：分片拼接</text>
<rect x="18.0" y="175" width="438.0" height="34" rx="5" fill="#d7e8fa"/><text x="237.0" y="197" text-anchor="middle" font-size="14">a | b → [a,b] | [a,b]</text>
<text x="18" y="242" font-size="15">Reduce-Scatter：相加后分散</text>
<rect x="18.0" y="251" width="438.0" height="34" rx="5" fill="#d7e8fa"/><text x="237.0" y="273" text-anchor="middle" font-size="14">[a₀,a₁] | [b₀,b₁] → 各留一片</text>
<text x="18" y="318" font-size="15">All-to-All：按目标分别发送</text>
<rect x="18.0" y="327" width="438.0" height="34" rx="5" fill="#d7e8fa"/><text x="237.0" y="349" text-anchor="middle" font-size="14">G0→G1 的片；G1→G0 的片</text>
<text x="18" y="394" font-size="15">P2P：指定发送与接收</text>
<rect x="18.0" y="403" width="438.0" height="34" rx="5" fill="#d7e8fa"/><text x="237.0" y="425" text-anchor="middle" font-size="14">GPU 0：a → GPU 1：a</text>
<text x="18" y="479" font-size="14">竖线区分两卡；归约示例采用求和</text></g></svg>