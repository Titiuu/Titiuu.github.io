<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Titiuu 的博客分类阅读页，支持目录搜索、时间排序和 Markdown 预览。"
    />
    <title>Titiuu | Blog Reader</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="paper-grain" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Titiuu home">Titiuu</a>
      <nav class="nav-links" aria-label="Primary navigation">
        <a href="category.html?category=tech" data-i18n="nav.tech">技术分享</a>
        <a href="category.html?category=papers" data-i18n="nav.papers">论文解读</a>
        <a href="category.html?category=projects" data-i18n="nav.projects">项目分享</a>
      </nav>
      <form class="site-search" id="site-search-form" role="search">
        <label class="sr-only" for="site-search-input" data-i18n="search.label">搜索博客</label>
        <input
          id="site-search-input"
          type="search"
          autocomplete="off"
          placeholder="搜索博客名称"
          data-i18n-placeholder="search.placeholder"
        />
        <div class="search-results" id="site-search-results" aria-live="polite"></div>
      </form>
      <div class="language-switch" aria-label="Language switch">
        <button class="lang-button is-active" type="button" data-lang="zh">中文</button>
        <button class="lang-button" type="button" data-lang="en">EN</button>
      </div>
    </header>

    <main class="reader-layout" data-reader>
      <aside class="reader-sidebar" aria-labelledby="reader-title">
        <p class="eyebrow" id="reader-eyebrow">博客目录</p>
        <h1 id="reader-title">论文解读</h1>
        <p class="reader-count" id="reader-count"></p>

        <div class="reader-controls">
          <label class="sr-only" for="category-search">搜索当前分类</label>
          <input id="category-search" type="search" autocomplete="off" placeholder="搜索当前分类" />
          <button
            class="sort-toggle is-desc"
            type="button"
            data-sort-toggle
            aria-label="当前排序：新到旧，点击切换为旧到新"
            title="新到旧"
          >
            <svg class="sort-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path class="sort-arrow sort-arrow-up" d="M8 9L12 5L16 9M12 5V12" />
              <path class="sort-arrow sort-arrow-down" d="M16 15L12 19L8 15M12 19V12" />
            </svg>
            <span class="sr-only" data-sort-label>新到旧</span>
          </button>
        </div>

        <ol class="reader-list" id="reader-list"></ol>
      </aside>

      <article class="markdown-preview" id="markdown-preview" aria-live="polite"></article>
    </main>

    <footer class="site-footer">
      <span>© 2026 Titiuu</span>
      <a href="https://deerflow.tech" target="_blank" rel="noreferrer">Created By Deerflow</a>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
    <script src="blog-data.js"></script>
    <script src="script.js"></script>
  </body>
</html>
